<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contatto</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<style>
:root,[data-theme="light"]{
  --bg:#f7f6f2;--surface:#f9f8f5;--surface2:#fbfbf9;--offset:#f3f0ec;
  --border:#d4d1ca;--div:#dcd9d5;
  --txt:#28251d;--muted:#7a7974;--faint:#bab9b4;
  --pri:#01696f;--pri-h:#0c4e54;--pri-a:#0f3638;--pri-hl:#cedcd8;
  --err:#a12c7b;
  --ff:'Inter',sans-serif;--fd:'Instrument Serif',Georgia,serif;
  --xs:clamp(.75rem,.7rem + .25vw,.875rem);
  --sm:clamp(.875rem,.8rem + .35vw,1rem);
  --base:clamp(1rem,.95rem + .25vw,1.125rem);
  --lg:clamp(1.125rem,1rem + .75vw,1.5rem);
  --xl:clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
  --s1:.25rem;--s2:.5rem;--s3:.75rem;--s4:1rem;--s5:1.25rem;--s6:1.5rem;--s8:2rem;--s10:2.5rem;--s16:4rem;
  --r:var(--s2);--rm:var(--s2);--rl:.75rem;--rxl:1rem;--rfull:9999px;
  --sh0:0 1px 2px oklch(0.2 0.01 80/.06);
  --sh1:0 4px 12px oklch(0.2 0.01 80/.08);
  --sh2:0 12px 32px oklch(0.2 0.01 80/.12);
  --t:180ms cubic-bezier(.16,1,.3,1);
}
[data-theme="dark"]{
  --bg:#171614;--surface:#1c1b19;--surface2:#201f1d;--offset:#222120;
  --border:#393836;--div:#262523;
  --txt:#cdccca;--muted:#797876;--faint:#5a5957;
  --pri:#4f98a3;--pri-h:#227f8b;--pri-a:#1a626b;--pri-hl:#313b3b;
  --err:#d163a7;
  --sh0:0 1px 2px oklch(0 0 0/.2);
  --sh1:0 4px 12px oklch(0 0 0/.3);
  --sh2:0 12px 32px oklch(0 0 0/.4);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme]){
    --bg:#171614;--surface:#1c1b19;--surface2:#201f1d;--offset:#222120;
    --border:#393836;--div:#262523;
    --txt:#cdccca;--muted:#797876;--faint:#5a5957;
    --pri:#4f98a3;--pri-h:#227f8b;--pri-hl:#313b3b;
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{
  min-height:100dvh;
  font-family:var(--ff);
  font-size:var(--base);
  color:var(--txt);
  background:
    radial-gradient(circle at top, oklch(from var(--pri) l c h / .10), transparent 38%),
    var(--bg);
  line-height:1.6;
}
svg,img{display:block;max-width:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a,button{transition:color var(--t),background var(--t),border-color var(--t),box-shadow var(--t)}
:focus-visible{outline:2px solid var(--pri);outline-offset:3px;border-radius:var(--r)}

.shell{
  min-height:100dvh;
  display:grid;
  place-items:center;
  padding:var(--s6);
}

.wrap{
  width:100%;
  max-width:460px;
}

.topbar{
  display:flex;
  justify-content:flex-end;
  margin-bottom:var(--s3);
}

.btn-icon{
  width:36px;height:36px;
  display:flex;align-items:center;justify-content:center;
  border-radius:var(--rm);
  color:var(--muted);
  background:var(--surface);
  border:1px solid oklch(from var(--txt) l c h/.08);
  box-shadow:var(--sh0);
}
.btn-icon:hover{background:var(--offset);color:var(--txt)}

.err-box{
  background:oklch(from var(--err) l c h/.08);
  border:1px solid oklch(from var(--err) l c h/.25);
  border-radius:var(--rm);
  padding:var(--s4) var(--s5);
  color:var(--err);
  font-size:var(--sm);
  display:flex;
  align-items:flex-start;
  gap:var(--s3);
}
.err-box svg{flex-shrink:0;margin-top:1px}

.vc-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:calc(var(--rxl) + 4px);
  overflow:hidden;
  box-shadow:var(--sh2);
}

.vc-hero{
  background:linear-gradient(135deg,var(--pri),var(--pri-h));
  padding:var(--s10) var(--s8) var(--s6);
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}
.vc-av{
  width:84px;height:84px;
  border-radius:var(--rfull);
  background:rgba(255,255,255,.2);
  border:3px solid rgba(255,255,255,.36);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--fd);
  font-size:2rem;
  color:#fff;
  margin-bottom:var(--s4);
}
.vc-hero h1{
  font-family:var(--fd);
  font-size:var(--xl);
  font-weight:400;
  color:#fff;
  margin-bottom:var(--s1);
}
.vc-hero .role{
  font-size:var(--sm);
  color:rgba(255,255,255,.78);
}
.vc-hero .org{
  font-size:var(--xs);
  color:rgba(255,255,255,.58);
  margin-top:2px;
}

.vc-body{padding:var(--s5) var(--s6)}
.vc-row{
  display:flex;
  align-items:flex-start;
  gap:var(--s4);
  padding:var(--s3) 0;
  border-bottom:1px solid var(--div);
}
.vc-row:last-of-type{border-bottom:none}
.vc-ico{
  width:34px;height:34px;
  border-radius:var(--rm);
  background:var(--pri-hl);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  color:var(--pri);
}
.vc-ico svg{width:15px;height:15px}
.vc-c{flex:1;min-width:0}
.vc-lbl{
  font-size:var(--xs);
  color:var(--muted);
  margin-bottom:2px;
  text-transform:uppercase;
  letter-spacing:.04em;
}
.vc-val{
  font-size:var(--sm);
  word-break:break-word;
}
.vc-val a{
  color:var(--pri);
  text-decoration:none;
}
.vc-val a:hover{text-decoration:underline}

.vc-foot{
  padding:var(--s5) var(--s6);
  border-top:1px solid var(--div);
  display:flex;
  flex-direction:column;
  gap:var(--s3);
  align-items:center;
}
.vc-dl{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:var(--s2);
  padding:var(--s4);
  background:var(--pri);
  color:#fff;
  border-radius:var(--rm);
  font-size:var(--sm);
  font-weight:600;
  border:none;
  box-shadow:var(--sh0);
}
.vc-dl:hover{background:var(--pri-h);box-shadow:var(--sh1)}
.vc-pw{
  font-size:var(--xs);
  color:var(--faint);
  text-align:center;
}
.vc-pw a{
  color:var(--pri);
  text-decoration:none;
}
.vc-pw a:hover{text-decoration:underline}

.empty{
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  padding:var(--s10) var(--s4);
  color:var(--muted);
}
.empty svg{margin-bottom:var(--s4);opacity:.2}
.empty h3{
  color:var(--txt);
  font-size:var(--lg);
  margin-bottom:var(--s2);
  font-weight:400;
  font-family:var(--fd);
}
.empty p{
  font-size:var(--sm);
  max-width:34ch;
}

@media(max-width:768px){
  .shell{padding:var(--s4)}
  .vc-hero{padding:var(--s8) var(--s5) var(--s4)}
  .vc-body{padding:var(--s4)}
  .vc-foot{padding:var(--s4)}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>
<body>
<div class="shell">
  <div class="wrap">
    <div class="topbar">
      <button class="btn-icon" data-theme-toggle aria-label="Cambia tema" title="Cambia tema">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>
    </div>

    <div id="view">
      <div class="vc-card">
        <div class="vc-hero">
          <div class="vc-av">…</div>
          <h1>Caricamento…</h1>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

(function(){
  const btn = document.querySelector('[data-theme-toggle]');
  const root = document.documentElement;
  let theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  root.setAttribute('data-theme', theme);
  btn?.addEventListener('click', () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', theme);
  });
})();

function b64Decode(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

function vcUnesc(s){
  if(!s) return '';
  return String(s)
    .replace(/\\n/gi, '\n')
    .replace(/\\;/g, ';')
    .replace(/\\,/g, ',')
    .replace(/\\\\/g, '\\');
}

function esc(s){
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function triggerDl(vcStr, fn){
  const blob = new Blob([vcStr], { type: 'text/vcard;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (fn || 'contact').replace(/[^a-z0-9\-_]/gi, '-').toLowerCase() + '.vcf';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function parseVC(str){
  const g = f => {
    const m = str.match(new RegExp('^' + f + '[^:]*:(.*)$', 'im'));
    return m ? vcUnesc(m[1].trim()) : '';
  };
  const ga = f => [...str.matchAll(new RegExp('^' + f + '[^:]*:(.*)$', 'gim'))].map(m => vcUnesc(m[1].trim()));

  const sc = {};
  [...str.matchAll(/^X-SOCIALPROFILE;TYPE=([^:]+):(.*)$/gim)]
    .forEach(m => { sc[m[1].toLowerCase()] = m[2].trim(); });

  const n = g('N').split(';');
  const adr = g('ADR').split(';');
  const ph = ga('TEL');
  const em = ga('EMAIL');
  const orgRaw = g('ORG').split(';');

  return {
    fn: vcUnesc(n[1] || ''),
    ln: vcUnesc(n[0] || ''),
    dn: g('FN'),
    tit: g('TITLE'),
    org: vcUnesc(orgRaw[0] || ''),
    p1: ph[0] || '',
    p2: ph[1] || '',
    p3: ph[2] || '',
    fx: ph[3] || '',
    e1: em[0] || '',
    e2: em[1] || '',
    wb: g('URL'),
    st: vcUnesc(adr[2] || ''),
    ci: vcUnesc(adr[3] || ''),
    re: vcUnesc(adr[4] || ''),
    zp: vcUnesc(adr[5] || ''),
    co: vcUnesc(adr[6] || ''),
    li: sc.linkedin || '',
    x: sc.twitter || sc.x || '',
    ig: sc.instagram || '',
    gh: sc.github || '',
    fb: sc.facebook || '',
    tk: sc.tiktok || '',
    mp: sc.maps || '',
    wbs: sc.social || '',
    no: g('NOTE')
  };
}

(function(){
  const root = document.getElementById('view');
  const vc = new URLSearchParams(window.location.search).get('vc');

  if(!vc){
    root.innerHTML = `
      <div class="err-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>Nessuna vCard nel link.</span>
      </div>`;
    return;
  }

  try{
    const vcStr = b64Decode(vc);
    const d = parseVC(vcStr);
    const fname = (d.dn || `${d.fn} ${d.ln}`).trim() || 'Contatto';
    const ini = fname.split(/\s+/).map(w => w[0] || '').slice(0,2).join('').toUpperCase() || '?';

    const PI = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2A19.79 19.79 0 0 1 11.27 19 19.44 19.44 0 0 1 5 12.72 19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`;
    const EI = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>`;
    const WI = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`;
    const MI = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`;
    const LI = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>`;
    const NI = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>`;

    const rows = [];
    const row = (ic, lb, val) => rows.push(`
      <div class="vc-row">
        <div class="vc-ico">${ic}</div>
        <div class="vc-c">
          <div class="vc-lbl">${lb}</div>
          <div class="vc-val">${val}</div>
        </div>
      </div>`);

    if(d.p1) row(PI, 'Telefono Lavoro', `<a href="tel:${esc(d.p1)}">${esc(d.p1)}</a>`);
    if(d.p2) row(PI, 'Cellulare', `<a href="tel:${esc(d.p2)}">${esc(d.p2)}</a>`);
    if(d.p3) row(PI, 'Telefono Casa', `<a href="tel:${esc(d.p3)}">${esc(d.p3)}</a>`);
    if(d.fx) row(PI, 'Fax', esc(d.fx));
    if(d.e1) row(EI, 'Email', `<a href="mailto:${esc(d.e1)}">${esc(d.e1)}</a>`);
    if(d.e2) row(EI, 'Email Personale', `<a href="mailto:${esc(d.e2)}">${esc(d.e2)}</a>`);
    if(d.wb) row(WI, 'Sito web', `<a href="${esc(d.wb)}" target="_blank" rel="noopener noreferrer">${esc(d.wb)}</a>`);
    if(d.st || d.ci || d.re || d.zp || d.co) row(MI, 'Indirizzo', esc([d.st,d.ci,d.re,d.zp,d.co].filter(Boolean).join(', ')));
    if(d.li) row(LI, 'LinkedIn', `<a href="${esc(d.li)}" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>`);
    if(d.x) row(LI, 'X', `<a href="${esc(d.x)}" target="_blank" rel="noopener noreferrer">X ↗</a>`);
    if(d.ig) row(LI, 'Instagram', `<a href="${esc(d.ig)}" target="_blank" rel="noopener noreferrer">Instagram ↗</a>`);
    if(d.fb) row(LI, 'Facebook', `<a href="${esc(d.fb)}" target="_blank" rel="noopener noreferrer">Facebook ↗</a>`);
    if(d.tk) row(LI, 'TikTok', `<a href="${esc(d.tk)}" target="_blank" rel="noopener noreferrer">TikTok ↗</a>`);
    if(d.mp) row(LI, 'Maps', `<a href="${esc(d.mp)}" target="_blank" rel="noopener noreferrer">Mappa ↗</a>`);
    if(d.wbs) row(LI, 'Social', `<a href="${esc(d.wbs)}" target="_blank" rel="noopener noreferrer">Altro social ↗</a>`);
    if(d.gh) row(LI, 'GitHub', `<a href="${esc(d.gh)}" target="_blank" rel="noopener noreferrer">GitHub ↗</a>`);
    if(d.no) row(NI, 'Note', esc(d.no).replace(/\n/g, '<br>'));

    if(!rows.length){
      rows.push(`
        <div class="empty">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <path d="M8 9h8M8 13h5"/>
          </svg>
          <h3>Nessun dettaglio disponibile</h3>
          <p>La vCard non contiene ancora campi pubblici da mostrare.</p>
        </div>`);
    }

    root.innerHTML = `
      <div class="vc-card">
        <div class="vc-hero">
          <div class="vc-av">${esc(ini)}</div>
          <h1>${esc(fname)}</h1>
          ${d.tit ? `<div class="role">${esc(d.tit)}</div>` : ''}
          ${d.org ? `<div class="org">${esc(d.org)}</div>` : ''}
        </div>
        <div class="vc-body">${rows.join('')}</div>
        <div class="vc-foot">
          <button class="vc-dl" id="dlbtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            Scarica contatto (.vcf)
          </button>
          <span class="vc-pw">vCard by <a href="https://obiettivoqr.it" target="_blank" rel="noopener noreferrer">obiettivoQR.it</a></span>
        </div>
      </div>`;

    const dl = () => triggerDl(vcStr, fname);
    document.getElementById('dlbtn').addEventListener('click', dl);
    setTimeout(dl, 500);
  }catch(err){
    root.innerHTML = `
      <div class="err-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span>Errore lettura vCard: ${esc(err.message)}</span>
      </div>`;
  }
})();
</script>
</body>
</html>
